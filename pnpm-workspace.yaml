packages:
  - packages/*
  - apps/*

# Packages whose install scripts may run (pnpm blocks the rest): binaries for Cypress, esbuild,
# the ESLint import resolver and the Workers runtime.
onlyBuiltDependencies:
  - cypress
  - esbuild
  - unrs-resolver
  - workerd

# Patched versions of dependencies we can't bump directly, pinned so they never jump a major.
# Drop each one once the package that pulls it in ships the fix itself.
overrides:
  # wrangler > miniflare: denial of service and SRI bypass fixed in 7.30.1.
  undici@>=7.0.0 <7.30.1: 7.30.1
  # @opennextjs/cloudflare > @node-minify/core: command injection in the CLI fixed in 10.5.0.
  glob@>=10.2.0 <10.5.0: 10.5.0
